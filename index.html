<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kisan 3D Pro</title>
<style>body{margin:0;overflow:hidden;background:#000;font-family:Arial} #ui{position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,0.7);color:#fff;padding:10px;display:flex;justify-content:space-around;font-weight:900;z-index:10} #controls{position:absolute;bottom:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:10}.row{display:flex;gap:10px}.btn{background:#FFC107;border:3px solid #000;width:70px;height:70px;border-radius:15px;font-size:30px;font-weight:900}.tool{background:#fff;padding:8px 14px;border-radius:20px;border:0;font-weight:900}.tool.on{background:#FF5722;color:#fff} #top{position:absolute;top:50px;left:0;right:0;text-align:center;z-index:10;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui"><div>💰 <span id="coin">500</span></div><div>🌾 <span id="stock">0</span></div><div>⛽ <span id="fuel">100</span>%</div></div>
<div id="top">
<button class="tool on" id="hal" onclick="setTool('hal')">🚜 HAL</button>
<button class="tool" onclick="setTool('dhaan')">🌾 DHAAN</button>
<button class="tool" onclick="setTool('ganna')">🎋 GANNA</button>
<button class="tool" onclick="setTool('pani')">💧 PANI</button>
<button class="tool" onclick="setTool('kaat')">✂️ KAAT</button>
</div>
<div id="controls">
<div class="row"><button class="btn" ontouchstart="move(0,1)">⬆️</button></div>
<div class="row"><button class="btn" ontouchstart="move(-1,0)">⬅️</button><button class="btn" ontouchstart="move(1,0)">➡️</button></div>
<div class="row"><button class="btn" ontouchstart="move(0,-1)">⬇️</button></div>
<div class="row"><button class="tool" style="background:#4CAF50;color:#fff" onclick="sell()">🚛 MANDI BECHO</button><button class="tool" style="background:#2196F3;color:#fff" onclick="fuel=100;upd()">⛽ DIESEL</button></div>
</div>
<script type="module">
import * as THREE from 'three';
let scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB);
let camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
let light=new THREE.DirectionalLight(0xffffff,1); light.position.set(10,20,10); scene.add(light); scene.add(new THREE.AmbientLight(0xffffff,0.6));

let groundMat=new THREE.MeshLambertMaterial({color:0x8D6E63});
let tilledMat=new THREE.MeshLambertMaterial({color:0x5D4037});
let ground=[]; let farm=[];
for(let x=-5;x<=5;x++){ farm[x]=[];
 for(let z=-5;z<=5;z++){
  let geo=new THREE.BoxGeometry(1.9,0.2,1.9);
  let mesh=new THREE.Mesh(geo,groundMat.clone()); mesh.position.set(x*2,0,z*2); scene.add(mesh);
  ground.push(mesh); farm[x][z]={mesh:mesh,t:0,g:0,crop:'',tm:0,plant:null};
 }
}

let tractorGroup=new THREE.Group(); scene.add(tractorGroup);
let body=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.8,1.8), new THREE.MeshLambertMaterial({color:0x2E7D32})); body.position.y=0.8; tractorGroup.add(body);
let cabin=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.7,0.7), new THREE.MeshLambertMaterial({color:0x1565C0})); cabin.position.set(0,1.4,-0.3); tractorGroup.add(cabin);
let wheelGeo=new THREE.CylinderGeometry(0.3,0.3,0.2,12); wheelGeo.rotateZ(Math.PI/2);
let w1=new THREE.Mesh(wheelGeo,new THREE.MeshLambertMaterial({color:0x111111})); w1.position.set(-0.7,0.3,0.6); tractorGroup.add(w1);
let w2=w1.clone(); w2.position.set(0.7,0.3,0.6); tractorGroup.add(w2);
let w3=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.3,12).rotateZ(Math.PI/2),new THREE.MeshLambertMaterial({color:0x111111})); w3.position.set(-0.7,0.3,-0.6); tractorGroup.add(w3);
let w4=w3.clone(); w4.position.set(0.7,0.3,-0.6); tractorGroup.add(w4);

let tx=0,tz=0; let tool='hal'; let coin=500,stock=0,fuel=100;
window.setTool=(t)=>{tool=t; document.querySelectorAll('.tool').forEach(b=>b.classList.remove('on')); event.target.classList.add('on');}
window.upd=()=>{document.getElementById('coin').innerText=coin; document.getElementById('stock').innerText=stock; document.getElementById('fuel').innerText=Math.floor(fuel);}
window.sell=()=>{if(stock==0)return alert("Fasal kaato pehle!"); coin+=stock*40; alert(stock+" bori bechi ₹"+stock*40); stock=0; upd();}

window.move=(dx,dz)=>{
 if(fuel<=0)return alert("Diesel khatam!");
 tx=Math.max(-5,Math.min(5,tx+dx)); tz=Math.max(-5,Math.min(5,tz+dz));
 tractorGroup.position.set(tx*2,0.3,tz*2);
 fuel-=0.8;
 let f=farm[tx][tz];
 if(tool=='hal'){f.t=1; f.mesh.material.color.set(0x3E2723);}
 if((tool=='dhaan'||tool=='ganna')&&f.t==1&&f.g==0&&coin>=10){f.g=1;f.crop=tool;coin-=10; let p=new THREE.Mesh(new THREE.SphereGeometry(0.2,6,6),new THREE.MeshLambertMaterial({color:0x33691E})); p.position.set(tx*2,0.5,tz*2); scene.add(p); f.plant=p;}
 if(tool=='pani'&&f.g>0&&f.g<3){f.tm++; if(f.tm>1){f.g++; f.tm=0; if(f.plant){f.plant.scale.multiplyScalar(1.8); f.plant.material.color.set(f.crop=='ganna'?0x1B5E20:0x9CCC65);}}}
 if(tool=='kaat'&&f.g==3){f.g=0;f.t=0;f.mesh.material.color.set(0x8D6E63); scene.remove(f.plant); f.plant=null; stock++; coin+=10;}
 upd();
}

camera.position.set(0,10,10); camera.lookAt(0,0,0);
function animate(){requestAnimationFrame(animate); camera.position.x=tractorGroup.position.x; camera.position.z=tractorGroup.position.z+10; camera.lookAt(tractorGroup.position); renderer.render(scene,camera);}
animate(); upd();
window.addEventListener('keydown',e=>{if(e.key=='ArrowLeft')move(-1,0);if(e.key=='ArrowRight')move(1,0);if(e.key=='ArrowUp')move(0,-1);if(e.key=='ArrowDown')move(0,1);});
</script>
</body>
</html>
