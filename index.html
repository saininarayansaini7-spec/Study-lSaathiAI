{t:"10th हिंदी - Vidya Model Paper 2027 - किताब से Detailed",c:"VIDYA 10th HINDI 2027 - किताब के सिलेबस से - Detailed - दुकान वाला\n\nVidya की खासियत Detailed + सार + व्याख्या - किताब से:\n\nगद्य - किताब से Detailed:\n- मित्रता रामचंद्र शुक्ल - लेखक परिचय जन्म 1884 मृत्यु 1941, रचनाएँ, सार 10 लाइन, कठिन शब्द 20, प्रश्न उत्तर 8 - 5 अंक पक्का Vidya किताब से Detailed\n- ममता जयशंकर प्रसाद - लेखक परिचय जन्म 1889, सार, चरित्र चित्रण ममता का, प्रश्न उत्तर - 3 अंक\n\nपद्य - किताब से Detailed:\n- साखी कबीर - कवि परिचय जन्म 1398, 2 दोहे शब्दार्थ, भावार्थ 4 लाइन, व्याख्या 6 लाइन - 4 अंक पक्का Vidya किताब से\n- मनुष्यता मैथिलीशरण गुप्त - कवि परिचय जन्म 1886, पूरी कविता व्याख्या 10 लाइन, सार 5 लाइन - 6 अंक पक्का\n\nव्याकरण - किताब से Detailed:\n- समास विग्रह सहित 5 उदाहरण, अलंकार उदाहरण सहित पहचान Trick, रस परिभाषा उदाहरण सहित - किताब से Detailed 10 अंक\n- 20 MCQ - किताब के हर पाठ से Detailed - नया 2027\n- निबंध 15 निबंध तैयार - 200-250 शब्द - किताब से - विज्ञान वरदान 7 अंक पक्का Vidya\n\nकुल 70 अंक - पूरा किताब से Detailed - Vidya दुकान वाला!"},
{t:"10th गणित - Vidya Model Paper 2027 - किताब से Detailed",c:"VIDYA 10th GANIT 2027 - किताब के सिलेबस से Detailed - दुकान वाला\n\nVidya में हर अध्याय का सूत्र प्रमाण सहित, उदाहरण सहित - किताब से:\n\nवास्तविक संख्याएँ - यूक्लिड विभाजन प्रमेयिका कथन प्रमाण सहित - किताब पाठ 1 से - 4 अंक\nबहुपद - शून्यक गुणनखंड संबंध - प्रमाण सहित - पाठ 2 से\nदो चर रैखिक - ग्राफीय विधि ग्राफ सहित, बीजगणितीय प्रतिस्थापन विलोपन वज्रगुणन उदाहरण सहित - पाठ 3 से 5 अंक\nद्विघात - गुणनखंड विधि, पूर्ण वर्ग विधि प्रमाण सहित, सूत्र विधि x=-b+-root(b2-4ac)/2a सिद्ध सहित - पाठ 4 से 5 अंक पक्का Vidya Detailed\nसमांतर श्रेढ़ी - an=a+(n-1)d सिद्ध सहित, Sn=n/2[2a+(n-1)d] सिद्ध सहित, 5 उदाहरण - पाठ 5 से 5 अंक\nत्रिभुज - समरूपता प्रमेय प्रमाण सहित, पाइथागोरस प्रमेय प्रमाण चित्र सहित - पाठ 6 से 4 अंक\nनिर्देशांक - दूरी सूत्र root((x2-x1)2+(y2-y1)2) सिद्ध सहित, विभाजन सूत्र सिद्ध सहित - पाठ 7 से\nत्रिकोणमिति - अनुपात चित्र सहित, सर्वसमिका sin2+cos2=1 प्रमाण सहित, tan2+1=sec2 प्रमाण, 1+cot2=cosec2 प्रमाण, ऊँचाई दूरी 5 उदाहरण चित्र सहित - पाठ 8-9 से 10 अंक पक्का Vidya Detailed किताब से\nवृत्त - स्पर्श रेखा प्रमेय प्रमाण चित्र सहित - पाठ 10 से\nरचनाएँ - रचना चरण सहित चित्र सहित - पाठ 11 से 4 अंक\nवृत्त क्षेत्रफल - त्रिज्यखंड सूत्र (theta/360)*pir2 सिद्ध सहित, वृत्तखंड सूत्र - पाठ 12 से 3 अंक\nपृष्ठीय आयतन - घन, घनाभ, बेलन 2pir(r+h), शंकु 1/3pir2h, गोला 4/3pir3 - सूत्र सिद्ध सहित - पाठ 13 से 5 अंक\nसांख्यिकी - माध्य प्रत्यक्ष विधि, कल्पित माध्य, पद विचलन - सूत्र सहित 3 उदाहरण, माध्यिका l+(n/2-cf)/f*h सूत्र सहित, बहुलक l+(f1-f0)/(2f1-f0-f2)*h सूत्र सहित - पाठ 14 से 6 अंक पक्का Vidya\nप्रायिकता - सूत्र P(E)=अनुकूल/कुल - पाठ 15 से 4 अंक\n+ 20 MCQ किताब से Detailed\n\nकुल 70 अंक - पूरा किताब से Detailed + प्रमाण + चित्र - Vidya दुकान वाला!"}
],

{t:"🏪 Flight 10th - सभी विषय 2027 - दुकान वाला - Trick",c:"FLIGHT 10th 2027 - दुकान पर जैसा मिलता है - One Liner + Trick - Last Night Revision - किताब के सिलेबस से\n\nFlight में हर विषय की छोटी किताब आती है दुकान पर - One Liner + Trick - नीचे हर विषय का Button है - पूरा Model Paper किताब से!"},
{t:"10th हिंदी - Flight Model Paper 2027 - किताब से Trick",c:"FLIGHT 10th HINDI 2027 - किताब के सिलेबस से Trick - दुकान वाला\n\nFlight Trick - One Liner - Last Night:\n\nमित्रता - लेखक रामचंद्र शुक्ल - Trick: रामचंद्र के मित्र शुक्ल - सार 2 लाइन - 5 अंक पक्का Flight Trick किताब से\nममता - लेखक जयशंकर प्रसाद - Trick: जय की ममता - 3 अंक\nसाखी - कबीर - 2 दोहे - Trick: कबीर की साखी - 4 अंक पक्का Flight One Liner किताब से\nमनुष्यता - मैथिलीशरण गुप्त - Trick: मनुष्य गुप्त - सार 2 लाइन - 6 अंक पक्का\nसमास - द्वंद्व दोनों प्रधान, द्विगु संख्या, कर्मधारय विशेषण, बहुव्रीहि अन्य - Trick: द्वंद्व=दोनों, द्विगु=गिनती, कर्म=विशेषण, बहु=अन्य - 2 अंक Flight Trick किताब से\nअलंकार - उपमा जैसे, रूपक रूप, उत्प्रेक्षा मानो, अनुप्रास दोहराव - Trick: जैसे=उपमा, रूप=रूपक, मानो=उत्प्रेक्षा - 2 अंक\n20 MCQ - Flight में सबसे ज्यादा MCQ - किताब से One Liner - 20 अंक पक्का\nनिबंध - 5 निबंध Short - 50 शब्द - Trick से - विज्ञान वरदान 7 अंक Flight Short किताब से\n\nकुल 70 अंक - पूरा किताब से One Liner + Trick - Flight दुकान वाला!"},
{t:"10th गणित - Flight Model Paper 2027 - किताब से Trick",c:"FLIGHT 10th GANIT 2027 - किताब के सिलेबस से Formula Trick - दुकान वाला\n\nFlight Formula Trick - Last Night:\n\nवास्तविक - यूक्लिड - Trick: a=bq+r - 4 अंक\nद्विघात सूत्र - x=-b+-root(b2-4ac)/2a - Trick: बाप - बेटा बटा 2a - 5 अंक पक्का Flight Trick किताब से\nसमांतर श्रेढ़ी - an=a+(n-1)d - Trick: a + (n-1)d = अन - 5 अंक\nत्रिकोणमिति - sin2+cos2=1 - Trick: साइन कॉस भाई 1 - 10 अंक पक्का Flight Trick किताब से\nसांख्यिकी माध्य - Trick: Sum / n - 6 अंक\nपृष्ठीय आयतन - बेलन 2pir(r+h) - Trick: 2pi r (r+h) = बेलन, शंकु 1/3pir2h - Trick: 1/3 शंकु, गोला 4/3pir3 - Trick: 4/3 गोला - 5 अंक Flight Trick\n\nसभी सूत्रों का Shortcut Trick - किताब के सिलेबस से - Flight दुकान वाला - Fail भी पास!"}
],
