<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tractor Rush - Kheti Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:Arial;color:#fff;touch-action:none}
#top{position:absolute;top:0;left:0;right:0;height:55px;background:linear-gradient(90deg,#1a0033,#4a0080);display:flex;justify-content:space-between;align-items:center;padding:0 10px;z-index:10;border-bottom:2px solid #ff00ff}
.stat{background:rgba(0,0,0,0.6);padding:6px 12px;border-radius:20px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:5px;border:1px solid #00ffff}
#center{position:absolute;top:65px;left:50%;transform:translateX(-50%);background:#000;padding:6px 20px;border-radius:10px;font-weight:900;font-size:18px;z-index:10;border:2px solid #fff}
canvas{display:block;width:100vw;height:100vh}
#controls{position:absolute;bottom:85px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:10}
.arrow{width:80px;height:80px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;border:2px solid #fff;backdrop-filter:blur(5px)}
#bottom{position:absolute;bottom:0;left:0;right:0;height:75px;background:#0a0a2a;display:flex;justify-content:space-around;align-items:center;z-index:10;border-top:2px solid #ff00ff}
.bbtn{width:70px;text-align:center;font-size:10px;font-weight:900}.bbtn div{font-size:30px}.on{color:#00ff00;transform:scale(1.1)}
#swipeHint{position:absolute;bottom:180px;left:50%;transform:translateX(-50%);background:rgba(255,0,255,0.8);padding:10px 20px;border-radius:20px;font-weight:900;animation:blink 1s infinite;z-index:10}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
</style>
</head>
<body>
<div id="top">
<div class="stat">⚡ <span id="lvl">1</span> | 🛡️ <span id="shield">2</span></div>
<div class="stat">💰 <span id="coin">7787</span></div>
</div>
<div id="center">LEVEL <span id="level">199</span> - KHETI RUSH</div>
<canvas id="c"></canvas>
<div id="swipeHint">👆 SWIPE KARO TRACTOR CHALANE KE LIYE</div>
<div id="controls">
<div class="arrow" id="left">«</div>
<div class="arrow" id="right">»</div>
</div>
<div id="bottom">
<div class="bbtn on" onclick="setTool('hal')"><div>🚜</div>GARAGE<br>HAL</div>
<div class="bbtn" onclick="setTool('beej')"><div>🌱</div>SEASON<br>BEEJ</div>
<div class="bbtn" onclick="setTool('pani')"><div>💧</div>STORE<br>PANI</div>
<div class="bbtn" onclick="setTool('kaat')"><div>✂️</div>CHALLENGE<br>KAAT</div>
</div>

<script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=innerWidth; canvas.height=innerHeight;
let coin=7787,level=1,tool='hal',tractorX=0,speed=8,lanes=[-120,-40,40,120],lane=1,khet=[],score=0;
let tractorImg="🚜";
function setTool(t){tool=t;document.querySelectorAll('.bbtn').forEach(b=>b.classList.remove('on'));event.currentTarget.classList.add('on'); tractorImg=t=='hal'?'🚜':t=='beej'?'🚜🌱':t=='pani'?'🚜💧':'🚜✂️';}

// Khet generate
for(let i=0;i<30;i++){khet.push({z:i*150+300, x: lanes[Math.floor(Math.random()*4)], type: Math.random()>0.6?'ready':'kacha', done:false});}

function drawRoad(){
 ctx.fillStyle="#4a0080"; ctx.fillRect(0,0,canvas.width,canvas.height);
 // perspective road
 let cx=canvas.width/2;
 for(let i=0;i<canvas.height;i+=20){
  let persp = i/canvas.height;
  let w = 200 + persp*800;
  ctx.fillStyle=i%40<20?"#8a00ff":"#6a00cc";
  ctx.fillRect(cx-w/2, i, w, 20);
  // side green
  ctx.fillStyle="#0a4a0a"; ctx.fillRect(0,i,cx-w/2,20); ctx.fillRect(cx+w/2,i,cx-w/2,20);
 }
 // center line
 ctx.strokeStyle="#ff00aa"; ctx.lineWidth=4; ctx.setLineDash([30,30]); ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,canvas.height); ctx.stroke(); ctx.setLineDash([]);
}

function draw(){
 drawRoad();
 let cx=canvas.width/2;
 // draw khet patches coming towards you
 khet.forEach(k=>{
  k.z-=speed; if(k.z<-100){k.z=3000; k.x=lanes[Math.floor(Math.random()*4)]; k.done=false; k.type=Math.random()>0.5?'ready':'kacha';}
  let scale=1000/(k.z+200); let y=canvas.height - k.z/8; if(y<60||y>canvas.height-100) return;
  let x=cx + k.x*scale;
  if(!k.done){
   if(k.type=='kacha'){ctx.font=(20*scale)+"px serif"; ctx.fillText("🟫",x,y);}
   else{ctx.font=(30*scale)+"px serif"; ctx.fillText(tool=='hal'?"🟫":tool=='beej'?"🌱":tool=='pani'?"🌾":"🌾",x,y);}
  }
  // collision
  if(Math.abs(k.z)<120 && Math.abs(k.x - tractorX)<60 &&!k.done){
   if(tool=='hal'&&k.type=='kacha'){k.done=true; coin+=10; score++;}
   if(tool=='beej'&&k.type=='kacha'){k.done=true; coin+=20; score++;}
   if(tool=='pani'&&k.type=='ready'){k.done=true; coin+=30; score++;}
   if(tool=='kaat'&&k.type=='ready'){k.done=true; coin+=50; score++;}
   document.getElementById('coin').innerText=coin;
   if(score>10){level++; score=0; speed+=1; document.getElementById('level').innerText=level;}
  }
 });
 // tractor
 let tx=cx+tractorX; let ty=canvas.height-140;
 ctx.font="70px serif"; ctx.fillText("🚜",tx-35,ty);
 ctx.fillStyle="#ff00ff"; ctx.shadowBlur=20; ctx.shadowColor="#ff00ff"; ctx.fillRect(tx-30,ty+10,60,8); ctx.shadowBlur=0;
 requestAnimationFrame(draw);
}
draw();

// controls
let startX=0; canvas.addEventListener('touchstart',e=>{startX=e.touches[0].clientX; document.getElementById('swipeHint').style.display='none';});
canvas.addEventListener('touchmove',e=>{
 let dx=e.touches[0].clientX-startX; if(Math.abs(dx)>30){ if(dx>0&&lane<3){lane++; tractorX=lanes[lane];} if(dx<0&&lane>0){lane--; tractorX=lanes[lane];} startX=e.touches[0].clientX; }
});
document.getElementById('left').onclick=()=>{if(lane>0){lane--; tractorX=lanes[lane];}};
document.getElementById('right').onclick=()=>{if(lane<3){lane++; tractorX=lanes[lane];}};
window.addEventListener('keydown',e=>{if(e.key=='ArrowLeft'&&lane>0){lane--; tractorX=lanes[lane];} if(e.key=='ArrowRight'&&lane<3){lane++; tractorX=lanes[lane];}});
function setTool(t){tool=t; document.querySelectorAll('.bbtn').forEach(b=>b.classList.remove('on')); event.currentTarget.classList.add('on');}
</script>
</body>
</html>
