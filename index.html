Appearance, Pulse, Grimace, Activity, Respiration - Each 0-2 = Total 10
7-10 Normal, 4-6 Mild Asphyxia, 0-3 Severe

At Birth: BCG, OPV 0, Hep B

{year:"3rd Year", title:"6. Midwifery OBG - Full PDF - Most Imp", content:`Midwifery & OBG - StudSaathi Super Notes - 30 Marks

Duration: 40 Weeks, 9 Months, 280 Days
Trimester: 1st (0-12 wk), 2nd (13-28 wk), 3rd (29-40 wk)

2. ANTENATAL CARE:
Minimum 4 Visits, TT Injection 2 doses, IFA Tablets 180 days
Weight Gain in Pregnancy: 10-12 kg
Hb should be >11 gm%

1st Stage: Cervix Dilatation 0-10 cm (Longest - 12-14 hrs in Primigravida)
2nd Stage: Birth of Baby
3rd Stage: Delivery of Placenta

APH = Antepartum Hemorrhage, PPH = Postpartum Hemorrhage (>500 ml blood loss)

5. FAMILY PLANNING:
Temporary: Condom, Mala-D, Copper-T

6. NORMAL DELIVERY: Episiotomy, Cord Clamping after 1-3 min
